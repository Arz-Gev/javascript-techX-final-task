<!DOCTYPE html>
<html lang="en" class="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popular Movies — The Movie Database (TMDB)</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/sources/header/title-icon.png"
    />
    <link rel="stylesheet" href="/css/general.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/general-media.css" />
    <script defer src="/js/header.js"></script>
    <script defer src="/js/script.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap");
    </style>
  </head>
  <body>
    <header class="header">
      <button onclick="showMenu()" type="button" class="menu-button">
        <img
          width="29px"
          height="29px"
          class="menue-icon"
          src="/sources/header/mobile-menue-img.svg"
          alt="plus"
        />
      </button>
      <a class="logo-link" href="/html/index.html">
        <picture>
          <source
            media="(max-width: 768px)"
            srcset="/sources/header/mobile-logo.svg"
            width="55"
            height="40"
          />
          <source
            media="(min-width: 769px)"
            srcset="/sources/header/logo.svg"
            width="154"
            height="20"
          />
          <img src="" alt="logo" class="logo" />
        </picture>
      </a>
      <nav class="header-content desktop-width">
        <div class="nav-left">
          <div class="dropdown-menu">
            <button
              onclick="displayDropdown('dropdown-content-movies')"
              type="button"
              class="dropdown-button"
              id="movies-button"
            >
              Movies
            </button>
            <div class="dropdown-content dropdown-content-movies">
              <a class="dropdown-link" href="#">Popular</a>
              <a class="dropdown-link" href="#">Now Playing</a>
              <a class="dropdown-link" href="#">Upcoming</a>
              <a class="dropdown-link" href="#">Top Rated</a>
            </div>
          </div>
          <div class="dropdown-menu">
            <button
              onclick="displayDropdown('dropdown-content-tv-shows')"
              type="button"
              class="dropdown-button"
              id="tv-shows-button"
            >
              TV Shows
            </button>
            <div class="dropdown-content dropdown-content-tv-shows">
              <a class="dropdown-link" href="#">Popular</a>
              <a class="dropdown-link" href="#">Airing Today</a>
              <a class="dropdown-link" href="#">On TV</a>
              <a class="dropdown-link" href="#">Top Rated</a>
            </div>
          </div>
          <div class="dropdown-menu">
            <button
              onclick="displayDropdown('dropdown-content-poeple')"
              type="button"
              class="dropdown-button"
              id="people-button"
            >
              People
            </button>
            <div class="dropdown-content dropdown-content-poeple">
              <a class="dropdown-link" href="#">Popular People</a>
            </div>
          </div>
          <div class="dropdown-menu">
            <button
              type="button"
              class="dropdown-button mobile-none"
              id="more-button"
            >
              More
            </button>
            <div class="dropdown-content header-more">
              <a class="dropdown-link desktop-none" href="#"
                >Contribution Bible</a
              >
              <a class="dropdown-link" href="#">Discussions</a>
              <a class="dropdown-link" href="#">Leaderboard</a>
              <a class="dropdown-link desktop-none" href="#">API</a>
              <a class="dropdown-link" href="#">Support</a>
              <a class="dropdown-link desktop-none" href="#">About</a>
              <a class="dropdown-link mobile-none" href="#"
                >API Documentation</a
              >
              <a class="dropdown-link mobile-none" href="#">API for Business</a>
            </div>
          </div>
        </div>
        <div class="nav-right">
          <img
            width="22.4px"
            height="22.4px"
            class="nav-item mobile-none"
            src="/sources/header/plus.svg"
            alt="plus"
          />
          <div class="nav-item en-box mobile-none">EN</div>
          <div class="nav-item">Login</div>
          <div class="nav-item mobile-none">Join TMDB</div>
        </div>
      </nav>
      <img
        width="29px"
        height="29px"
        class="person-icon"
        src="/sources/header/person-icon.svg"
        alt="plus"
      />
      <img
        width="29px"
        height="29px"
        class="search-icon"
        src="/sources/header/search-icon.svg"
        alt="plus"
      />
    </header>
    <main class="main desktop-width"></main>
    <footer class="footer">
      <div class="footer-content desktop-width"></div>
    </footer>
  </body>
</html>
